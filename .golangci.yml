version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: all
  disable:
    - depguard # no import allow/deny lists needed
    - err113 # sentinel errors too verbose for this codebase
    - exhaustive # don't require exhaustive switch on enums
    - exhaustruct # don't require all struct fields populated
    - gochecknoglobals # constants and singletons are fine
    - godox # allow TODO/FIXME comments
    - gomodguard # deprecated; gomodguard_v2 is enabled below
    - ireturn # allow returning interfaces
    - lll # long lines acceptable in math-heavy code
    - mnd # magic numbers acceptable in acoustics/DSP code
    - musttag # no struct tag enforcement needed
    - nlreturn # no blank-line-before-return enforcement
    - nonamedreturns # named returns useful for complex signatures
    - paralleltest # not enforcing t.Parallel everywhere
    - sqlclosecheck # no SQL in this project
    - testpackage # allow white-box tests in same package
    - varnamelen # short names idiomatic in math/signal-processing code
    - wsl # use wsl_v5 instead
  enable:
    - gomodguard_v2
    - wsl_v5

    - revive
  settings:
    cyclop:
      max-complexity: 15

    funlen:
      lines: 100

    tagliatelle:
      case:
        rules:
          json: snake

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      disable: [decl]
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1500
              skip-comments: false
              skip-blank-lines: false

  exclusions:
    generated: lax
    presets: [comments, common-false-positives, legacy, std-error-handling]

    rules:
      # cmd/ uses flag/cobra inits, wraps errors less strictly
      - linters: [gochecknoinits, wrapcheck]
        path: cmd/

      # test files are more relaxed
      - linters:
          [
            funlen,
            cyclop,
            gocognit,
            maintidx,
            wrapcheck,
            dupl,
            noctx,
            forcetypeassert,
            gosec,
            thelper,
            usetesting,
            goconst,
          ]
        path: _test\.go

      # wrapcheck too noisy in internal packages
      - linters: [wrapcheck]
        path: internal/

      # funlen/cyclop: acoustics solvers and PDE sweeps are inherently long
      - linters: [funlen, cyclop, gocognit]
        path: ism/
      - linters: [funlen, cyclop, gocognit]
        path: raytrace/
      - linters: [funlen, cyclop, gocognit]
        path: pde/

formatters:
  enable:
    - gofmt
