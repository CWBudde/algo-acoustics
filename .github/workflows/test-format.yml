name: Format Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: treefmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

      - name: Install Go formatters
        run: go install mvdan.cc/gofumpt@v0.10.0 && go install github.com/daixiang0/gci@v0.14.0

      - name: Install prettier
        run: npm install -g prettier@3.8.0

      - name: Run treefmt
        uses: isbecker/treefmt-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-change: true
