name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos:
          - darwin
          - linux
          - windows
        goarch:
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI and regression archives
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ github.ref_name }}
        run: |
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          export BUILD_DATE
          bash ./scripts/release.sh cli
          bash ./scripts/release.sh regression

      - name: Upload platform archives
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  bundles:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build web archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          export BUILD_DATE
          bash ./scripts/release.sh web

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - cli
      - bundles
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Create aggregate checksum manifest
        working-directory: release-assets
        run: sha256sum ./*.tar.gz ./*.zip >SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
