name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Platform Tests
    uses: ./.github/workflows/test-unit.yml

  regression:
    name: Regression Tests
    uses: ./.github/workflows/test-regression.yml

  web:
    name: Web Tests
    uses: ./.github/workflows/test-web.yml

  lint:
    name: Lint
    uses: ./.github/workflows/test-lint.yml

  format:
    name: Format Check
    uses: ./.github/workflows/test-format.yml
