name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "1.25.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: go test ./...

      - name: Smoke test roomir validate
        run: go run ./cmd/roomir validate testdata/rooms/shoebox_simple.json

  roombench-run:
    name: Roombench Regression Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Run roombench
        run: go run ./cmd/roombench run

  roombench-report:
    name: Roombench Corpus Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Generate benchmark report
        run: go run ./cmd/roombench report --format markdown

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench_report.md
          if-no-files-found: error
